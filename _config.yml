# General
title: Luke Fretwell
author: Luke Fretwell
description: "Designer, builder"
avatar: avatar.png
url: https://lukefretwell.com

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-paginate

# Pagination
paginate: 5
paginate_path: "/notes/page/:num/"
  
# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Date/time
date: "%B %-d, %Y"
timezone: America/Los_Angeles

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
      img-path: "pages"
  - scope:
      path: ""
      type: "notes"
    values:
      label: "Notes"
      layout: "note"
      img-path: "posts"
      folder: "posts"
      parent: "notes"
  - scope:
      path: "_work"
      type: "work"
    values:
      label: "Work"
      layout: "work"
      folder: "Work"
      parent: "work"
      img-path: "work"
  - scope:
      path: "_topics"
      type: "topics"
    values:
      layout: "topic"
      parent: "topics"
  - scope:
      path: "_people"
      type: "people"
    values:
      folder: "People"
      img-path: "people"
      parent: "people"
      layout: "people"
      schematype: "ProfilePage"
      og-type: "profile"

# Collections
collections:
  pages:
    output: true
    permalink: /:title
  posts:
    output: true
    permalink: /notes/:title
  work:
    output: true
    permalink: /work/:title
  topics:
    output: true
    permalink: /topics/:title
  people:
    output: true
    permalink: /people/:title

# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

# Include
include:
  - .well-known

# Exclude
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _site
  - .sass-cache
  - .DS_Store
  - .gitignore
  - .jekyll-metadata
  - .env
  - config.local.yml
  - config.production.yml
