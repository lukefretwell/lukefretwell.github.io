<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 card-group">
  {% for item in site.data.reading.docs limit: include.limit %}
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h2 class="h4">
            <a href="{{ site.baseurl }}{{ item.url }}" class="card-link">
              {{ item.title }}
            </a>
          </h2>
        </div>
        <div class="card-footer">
          <p class="card-byline">{{ item.author }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
