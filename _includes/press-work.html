{% if page.press %}
  {% for press in page.press %}
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h3 class="h4">
            <a
              href="{{ press.link }}"
              class="card-link"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="{{ press.title }} (opens in new tab)">{{ press.title }} <i class="fa-solid fa-arrow-up-right-from-square fa-xs" aria-hidden="true"></i></a>
          </h3>
        </div>
        <div class="card-footer">
          <p class="card-byline">{{ press.source }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
{% endif %}
