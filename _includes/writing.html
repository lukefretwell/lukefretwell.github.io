<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 card-group">
  {% if include.limit %}
    {% assign limitVar = include.limit | plus: 0 %}
  {% endif %}
  {% for item in site.data.writing.docs limit: limitVar %}
    <div class="col">
      <div class="card h-100"><div class="card-body">
        <h2 class="h4">
          <a
            href="{{ item.url }}"
            class="card-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="{{ item.title }} (opens in new tab)">
            {{ item.title }} <i class="fa-solid fa-arrow-up-right-from-square fa-xs" aria-hidden="true"></i>
          </a>
        </h2>
        <p class="card-description">{{ item.description }}</p>
      </div></div>
    </div>
  {% endfor %}
</div>
